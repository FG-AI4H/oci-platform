[project]
name = "oci-worker-eval"
version = "0.1.0"
description = "Sealed-execution runner: consumes evaluation submissions, runs a participant image under a sealed sandbox, POSTs the result to the API outbox."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.13"

# Deliberately small. `requests` is already in the tree as a `docker`
# dependency, so the outbox and the Cognito token exchange add nothing new.
# Versions verified against PyPI on 2026-07-31 (latest stable at that date);
# majors pinned, minor/patch floating, per CLAUDE.md rule 1.
dependencies = [
  "boto3>=1.43.61,<2",
  "docker>=7.2.0,<8",
  "pydantic>=2.13.4,<3",
  "requests>=2.34.2,<3",
]

[project.scripts]
oci-worker-eval = "worker_eval.__main__:main"

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "ruff>=0.16.1,<0.17"]

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_eval"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "SIM", "RUF", "PTH", "T20"]

[tool.ruff.lint.per-file-ignores]
# Wire-contract models mirror the TypeScript field names verbatim, so the
# attribute names are camelCase on purpose (see tests/test_contract_parity.py).
"src/worker_eval/contract.py" = ["N815"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "requires_docker: needs a real Docker daemon; SKIPPED (never passed) when none is reachable",
]
