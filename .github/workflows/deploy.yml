name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to deploy (dev | int | prod)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, int, prod]

permissions:
  id-token: write   # required for AWS OIDC
  contents: read
  packages: write   # for ECR pushes

concurrency:
  group: deploy-${{ github.event.inputs.target || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ACCOUNT_ID: '601883093460'
  ECR_REPO_API: oci-api
  ECR_REPO_WORKER_INGEST: oci-worker-ingest

jobs:
  # Branch pushes to main automatically deploy to dev. int/prod require manual dispatch.
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: dev
    secrets: inherit

  deploy-int:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'int'
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: int
    secrets: inherit

  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod'
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: prod
    secrets: inherit
