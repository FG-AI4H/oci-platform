name: Deploy

# Manual-only until Phase A1 provisions:
#  - GitHub OIDC roles `gha-oci-deploy-{dev,int,prod}` in AWS account 601883093460
#  - apps/api/Dockerfile and apps/worker-ingest/Dockerfile
#  - infra/cdk/lib/bootstrap-oidc-stack.ts deployed to all three envs
# Once those exist, switch the dev branch back to push-triggered.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to deploy (dev | int | prod)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, int, prod]

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: ${{ github.event.inputs.target }}
    secrets: inherit
