name: Deploy

# Triggers:
#  - push to main (auto-deploys dev only; doc-only changes are skipped via paths-ignore)
#  - workflow_dispatch (manual; choose dev / int / prod)
#
# The required GitHub Environment must exist on the repo (dev / int / prod) and the AWS
# OIDC role gha-oci-deploy-{env} must be provisioned via the oci-{env}-bootstrap CDK stack.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.prettierignore'
      - '.trivyignore'
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to deploy (dev | int | prod)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, int, prod]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.target || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ACCOUNT_ID: '601883093460'
  # Force JS actions onto Node 24 ahead of the GH Actions runner default
  # flip on 2026-06-02 (silences the aws-actions/configure-aws-credentials
  # Node 20 deprecation notice and surfaces incompat issues now).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - name: Wait for CI to pass on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Poll up to 15 min for CI on this SHA to reach a terminal state.
          # On a push, Deploy and CI fire from the same event and CI is
          # usually still in progress when Deploy's preflight starts.
          MAX_TRIES=60   # 60 × 15 s = 15 min
          TRY=0
          while (( TRY < MAX_TRIES )); do
            CI=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA" \
              --jq '[.workflow_runs[] | select(.name == "CI")][0]' || echo '{}')
            STATUS=$(echo "$CI" | jq -r '.status // ""')
            CONC=$(echo "$CI" | jq -r '.conclusion // ""')
            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONC" == "success" ]]; then
                echo "CI green for $SHA — proceeding."
                exit 0
              fi
              echo "::error::CI for $SHA finished with conclusion='$CONC'."
              exit 1
            fi
            echo "CI status='$STATUS' for $SHA — waiting (try $((TRY + 1))/$MAX_TRIES)..."
            TRY=$((TRY + 1))
            sleep 15
          done
          echo "::error::CI for $SHA did not complete within 15 min."
          exit 1

  build-images:
    needs: preflight
    # Native ARM64 runner — builds linux/arm64 images directly without
    # QEMU emulation. Avoids "qemu: uncaught target signal 4 (Illegal
    # instruction)" crashes that hit Turbopack / SWC native binaries
    # during `next build` under QEMU. Also ~2-3x faster than QEMU cross.
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.target || 'dev' }}
    outputs:
      api-image: ${{ steps.resolve.outputs.api }}
      web-image: ${{ steps.resolve.outputs.web }}
      ingest-image: ${{ steps.resolve.outputs.ingest }}
      migrate-image: ${{ steps.resolve.outputs.migrate }}
    steps:
      - uses: actions/checkout@v5
        with:
          # paths-filter needs the previous commit on main to compute
          # the diff base for `push` events; checkout depth=2 is enough.
          fetch-depth: 2

      - name: Enable Corepack
        run: corepack enable
      # setup-node@v5 auto-enables pnpm caching when package.json has a
      # `packageManager` field — even without `cache: 'pnpm'`. The
      # post-step then fails saving an empty pnpm store on this job
      # (we don't run `pnpm install` here, only `docker build`). Disable
      # the auto-detect explicitly. The cdk-deploy job below does
      # `pnpm install` and keeps caching.
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/gha-oci-deploy-${{ inputs.target || 'dev' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Per-image source-path filter. If none of an image's source paths
      # changed since the diff base (previous commit on main for `push`,
      # always rebuild for manual `workflow_dispatch`), the build +
      # Trivy steps for that image are skipped and the previous live
      # ECR tag is reused at cdk-deploy. Saves ~6-8 min for infra-only
      # PRs. Filters MUST include shared deps (pnpm-lock.yaml,
      # package.json) and the per-app Dockerfile so any change that
      # could affect the image triggers a rebuild.
      - name: Detect per-image source changes
        id: changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.before }}
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
            ingest:
              - 'apps/worker-ingest/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
            migrate:
              - 'apps/migrate/**'
              - 'packages/database/prisma/**'

      - name: Decide build vs reuse per image
        id: decide
        # Build an image iff `<repo>:<SHA>` doesn't already exist in ECR.
        # Two motivations to consult ECR rather than only the paths-filter:
        #   1. workflow_dispatch retries: the previous push run may have
        #      pushed `oci-api:<SHA>` already; ECR tags are IMMUTABLE
        #      (per bootstrap-oidc-stack), so a second push on the same
        #      SHA fails. Reuse instead.
        #   2. New ECR repo (e.g. oci-migrate, just bootstrapped): the
        #      paths-filter base for this push is the previous main
        #      commit, which probably doesn't include any apps/migrate
        #      changes — yet there's no <SHA> tag in ECR to reuse.
        #      ECR-existence catches this and forces a build.
        # paths-filter is still consulted as a fast-path "we know the
        # source changed" signal, but ECR is the source of truth.
        run: |
          set -euo pipefail
          SHA=${GITHUB_SHA::12}

          decide() {
            local name="$1" repo="$2" filter_changed="$3"
            local image_exists="false"
            if aws ecr describe-images \
                --repository-name "$repo" \
                --image-ids "imageTag=$SHA" \
                --output json >/dev/null 2>&1; then
              image_exists="true"
            fi

            if [[ "$image_exists" == "true" ]]; then
              echo "$name=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$repo:$SHA already in ECR — skipping build (immutable tag)." >&2
            elif [[ "$filter_changed" == "true" ]]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              # Manual deploy: any image not already at this SHA gets built.
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              # push event, paths-filter says unchanged, but the SHA tag
              # is missing in ECR (new repo, repo just emptied, etc.):
              # build it. Cheaper than failing at cdk-deploy with a
              # missing image reference.
              echo "$name=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$repo: paths-filter unchanged but $repo:$SHA missing in ECR; building." >&2
            fi
          }

          decide api     oci-api            "${{ steps.changes.outputs.api }}"
          decide web     oci-web            "${{ steps.changes.outputs.web }}"
          decide ingest  oci-worker-ingest  "${{ steps.changes.outputs.ingest }}"
          decide migrate oci-migrate        "${{ steps.changes.outputs.migrate }}"

      # buildx for parity with the previous QEMU-based pipeline (cache
      # support, --push behaviour). On a native ARM64 runner the
      # --platform linux/arm64 build is a no-op architecturally.
      - name: Setup Docker Buildx
        if: steps.decide.outputs.api == 'true' || steps.decide.outputs.web == 'true' || steps.decide.outputs.ingest == 'true' || steps.decide.outputs.migrate == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Compute image tags for build
        id: meta
        run: |
          SHA=${GITHUB_SHA::12}
          REG=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          echo "api=$REG/oci-api:$SHA"              >> "$GITHUB_OUTPUT"
          echo "web=$REG/oci-web:$SHA"              >> "$GITHUB_OUTPUT"
          echo "ingest=$REG/oci-worker-ingest:$SHA" >> "$GITHUB_OUTPUT"
          echo "migrate=$REG/oci-migrate:$SHA"      >> "$GITHUB_OUTPUT"
          echo "registry=$REG"                       >> "$GITHUB_OUTPUT"

      - name: Build & push API image (arm64)
        if: steps.decide.outputs.api == 'true'
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f apps/api/Dockerfile \
            -t "${{ steps.meta.outputs.api }}" \
            --push \
            .

      - name: Build & push Web image (arm64)
        if: steps.decide.outputs.web == 'true'
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f apps/web/Dockerfile \
            -t "${{ steps.meta.outputs.web }}" \
            --push \
            .

      - name: Build & push worker-ingest image (arm64)
        if: steps.decide.outputs.ingest == 'true'
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f apps/worker-ingest/Dockerfile \
            -t "${{ steps.meta.outputs.ingest }}" \
            --push \
            .

      - name: Build & push migrate image (arm64)
        if: steps.decide.outputs.migrate == 'true'
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f apps/migrate/Dockerfile \
            -t "${{ steps.meta.outputs.migrate }}" \
            --push \
            .

      # Trivy needs an explicit platform now that we publish ARM64-only
      # images (PR #29). Without TRIVY_PLATFORM, Trivy looks for a
      # linux/amd64 child in the manifest and fails.
      # Trivy is skipped when the image was reused — it was already
      # scanned at the prior deploy of the same content.
      - name: Trivy image scan (API)
        if: steps.decide.outputs.api == 'true'
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.meta.outputs.api }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy image scan (Web)
        if: steps.decide.outputs.web == 'true'
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.meta.outputs.web }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy image scan (Migrate)
        if: steps.decide.outputs.migrate == 'true'
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.meta.outputs.migrate }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      # Resolve the URIs cdk-deploy will pass to the relevant stacks.
      # With ECR-aware decide, the SHA tag is always present after this
      # job (either because the image was just rebuilt and pushed, or
      # because the build step skipped because it was already there).
      # Same SHA = same content, so the per-image URI is simply the
      # SHA-tagged URI from `meta`.
      - name: Resolve final image URIs
        id: resolve
        run: |
          {
            echo "api=${{ steps.meta.outputs.api }}"
            echo "web=${{ steps.meta.outputs.web }}"
            echo "ingest=${{ steps.meta.outputs.ingest }}"
            echo "migrate=${{ steps.meta.outputs.migrate }}"
          } >> "$GITHUB_OUTPUT"

  cdk-deploy:
    needs: build-images
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'dev' }}
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter "./packages/**" build && pnpm --filter "./infra/cdk" build

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/gha-oci-deploy-${{ inputs.target || 'dev' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: cdk diff
        working-directory: infra/cdk
        # Bootstrap stack is intentionally NOT in this list — see deploy step
        # below for rationale. Diff target == deploy target.
        run: |
          ENV='${{ inputs.target || 'dev' }}'
          # mail deploys before api/docuseal so the SMTP creds SSM param exists
          # when docuseal-stack reads it with --context mailEnabled=true.
          STACKS="oci-$ENV-network oci-$ENV-identity oci-$ENV-observability oci-$ENV-data oci-$ENV-mail oci-$ENV-api oci-$ENV-docuseal oci-$ENV-web"
          MIGRATE_CTX=""
          if [[ -n "${{ needs.build-images.outputs.migrate-image }}" ]]; then
            MIGRATE_CTX="--context migrateImage=${{ needs.build-images.outputs.migrate-image }}"
          fi
          pnpm cdk diff $STACKS \
            --context env=$ENV \
            --context apiImage=${{ needs.build-images.outputs.api-image }} \
            --context webImage=${{ needs.build-images.outputs.web-image }} \
            $MIGRATE_CTX || true

      - name: cdk deploy
        working-directory: infra/cdk
        # CI deploys ONLY the per-environment runtime stacks. The bootstrap
        # stack (OIDC provider, deploy role, ECR repos) is deployed manually
        # one time per AWS account and excluded here — including it in
        # `--all` would re-template the OIDC provider every CI run and
        # toggle it on / off depending on whether `createOidcProvider=true`
        # was passed (which would otherwise need to be lied about every
        # run). The bootstrap stack changes rarely; redeploy via:
        #   AWS_PROFILE=ai4h pnpm --filter @oci/cdk exec cdk deploy \
        #     oci-{env}-bootstrap --context env={env}
        run: |
          ENV='${{ inputs.target || 'dev' }}'
          APPROVAL=never
          if [[ "$ENV" == "prod" ]]; then APPROVAL=broadening; fi
          if [[ "$ENV" == "int" ]]; then APPROVAL=any-change; fi
          # mail deploys before api/docuseal so the SMTP creds SSM param exists
          # when docuseal-stack reads it with --context mailEnabled=true.
          STACKS="oci-$ENV-network oci-$ENV-identity oci-$ENV-observability oci-$ENV-data oci-$ENV-mail oci-$ENV-api oci-$ENV-docuseal oci-$ENV-web"
          MIGRATE_CTX=""
          if [[ -n "${{ needs.build-images.outputs.migrate-image }}" ]]; then
            MIGRATE_CTX="--context migrateImage=${{ needs.build-images.outputs.migrate-image }}"
          fi
          # docusealEnabled=true: wires DocuSeal env vars into api-stack +
          # keeps docuseal-stack service at desiredCount=1.
          # mailEnabled=true: wires SES SMTP creds into docuseal-stack so
          # DocuSeal sends signing emails via SES. Activate after:
          #   (1) mail-stack deployed, (2) rule set activated, (3) forward
          #   address verified in SES sandbox (see docs/for-operators/ses.md).
          pnpm cdk deploy $STACKS --require-approval $APPROVAL \
            --context env=$ENV \
            --context apiImage=${{ needs.build-images.outputs.api-image }} \
            --context webImage=${{ needs.build-images.outputs.web-image }} \
            --context ingestImage=${{ needs.build-images.outputs.ingest-image }} \
            --context docusealEnabled=${{ vars.DOCUSEAL_ENABLED || 'false' }} \
            --context mailEnabled=${{ vars.MAIL_ENABLED || 'false' }} \
            $MIGRATE_CTX

      - name: DB migrate
        # Skip when no migrate image is available (first deploy of a fresh
        # env, before apps/migrate has ever been built). After the first
        # build the MigrateTaskDef is in the stack and we always run.
        if: ${{ needs.build-images.outputs.migrate-image != '' }}
        run: |
          set -euo pipefail
          ENV='${{ inputs.target || 'dev' }}'

          # Pull the aggregated launch spec written by api-stack
          # (cluster ARN, task definition ARN, private-subnet ids,
          # API security-group id). Single SSM lookup keeps this step
          # decoupled from CDK output names.
          SPEC=$(aws ssm get-parameter \
            --name "/oci/$ENV/migrate/launch-spec" \
            --query 'Parameter.Value' --output text)

          CLUSTER=$(echo "$SPEC" | jq -r .cluster)
          TASKDEF=$(echo "$SPEC" | jq -r .taskDefinition)
          SUBNETS=$(echo "$SPEC" | jq -r '.subnets | join(",")')
          SGS=$(echo "$SPEC"     | jq -r '.securityGroups | join(",")')

          echo "Launching migrate task on $CLUSTER ($TASKDEF)"
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASKDEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=DISABLED}" \
            --started-by "gha-deploy-${{ github.run_id }}" \
            --query 'tasks[0].taskArn' --output text)

          if [[ -z "$TASK_ARN" || "$TASK_ARN" == "None" ]]; then
            echo "::error::run-task did not return a task ARN" >&2
            exit 1
          fi
          echo "Task: $TASK_ARN"

          # Wait for completion. The Aurora-pause-resume on the dev cluster
          # (auto-pause after 5 min idle) means a cold start can take ~30s
          # before Prisma can connect. The 'tasks-stopped' waiter polls
          # every 6s for up to 100 attempts — 10 min total, enough for
          # cold start + the few seconds of actual migration work.
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          # Inspect exit code + stop reason. Anything non-zero from
          # prisma migrate deploy fails the deploy here so the operator
          # sees the migration error before assuming the deploy is good.
          STATUS=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`migrate`] | [0]' --output json)
          EXIT=$(echo "$STATUS" | jq -r '.exitCode // "null"')
          REASON=$(echo "$STATUS" | jq -r '.reason // ""')
          STOPPED_REASON=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          echo "Container exit code: $EXIT"
          echo "Container reason: $REASON"
          echo "Task stopped reason: $STOPPED_REASON"

          if [[ "$EXIT" != "0" ]]; then
            echo "::error::Migrate task did not exit zero (exit=$EXIT, reason='$REASON', stopped='$STOPPED_REASON'). Check CloudWatch log group /oci/$ENV/api stream prefix migrate." >&2
            exit 1
          fi
          echo "Migrations applied (or no-op if up to date)."
