# Local-only stack for `pnpm dev`. Mirrors the dev-env services that the
# CDK provisions in AWS (Aurora Postgres + ElastiCache-equivalent Redis)
# at small scale. NOT for prod use. Credentials match the URLs hardcoded
# in apps/api/.env.example and apps/web/.env.example.

services:
  postgres:
    image: postgres:17-alpine
    container_name: oci-postgres
    environment:
      POSTGRES_USER: oci
      POSTGRES_PASSWORD: oci
      POSTGRES_DB: oci_dev
    ports:
      - '5432:5432'
    volumes:
      - oci-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oci -d oci_dev']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    container_name: oci-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible store for local dataset uploads (PR I, #87).
  # Real envs use AWS S3 (CDK provisions oci-datasets-<env>); MinIO
  # gives us the same API surface for `pnpm dev` so the multipart
  # presigned-URL flow can be exercised end-to-end without an AWS
  # account. The browser PUTs directly to localhost:9000.
  minio:
    image: minio/minio:latest
    container_name: oci-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # MinIO console (browse uploaded objects)
    volumes:
      - oci-minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/ready']
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot bucket bootstrap. Creates oci-datasets-local on first
  # boot; idempotent thereafter. CORS is set to allow direct PUT from
  # the local web app at :3001 — the same configuration the prod
  # CDK applies to the real bucket.
  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb -p local/oci-datasets-local 2>/dev/null || true &&
        mc anonymous set none local/oci-datasets-local &&
        printf '{\"CORSRules\":[{\"AllowedOrigins\":[\"http://localhost:3001\"],\"AllowedMethods\":[\"PUT\",\"GET\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"]}]}' > /tmp/cors.json &&
        mc cors set /tmp/cors.json local/oci-datasets-local 2>/dev/null || true &&
        echo 'minio bucket ready'
      "

  # DocuSeal — self-hosted e-signature for the AdES DUA signing flow
  # (#128). The API talks to this on http://localhost:3010 (or
  # http://docuseal:3000 from inside the compose network); DocuSeal
  # POSTs completion events back to the API at
  # http://host.docker.internal:3000/v2/dua/webhook/docuseal.
  #
  # First-boot setup (one-time, per fresh docker volume):
  #   1. Open http://localhost:3010 → create the admin user.
  #   2. Settings → API → generate a token. Copy it.
  #   3. Settings → Webhooks → add http://host.docker.internal:3000/v2/dua/webhook/docuseal
  #      with the same secret that's in apps/api/.env.local for
  #      OCI_DOCUSEAL_WEBHOOK_SECRET (default `local-dev-secret`).
  #   4. Write the token into apps/api/.env.local:
  #        OCI_DOCUSEAL_API_TOKEN=<token from step 2>
  #        OCI_DOCUSEAL_BASE_URL=http://localhost:3010
  #        OCI_DOCUSEAL_WEBHOOK_SECRET=local-dev-secret
  #   5. Restart `pnpm --filter @oci/api dev`.
  #
  # SECRET_KEY_BASE is Rails-style cookie/session key; auto-set per
  # compose tear-down (rotates on docker compose down -v).
  docuseal:
    image: docuseal/docuseal:latest
    container_name: oci-docuseal
    environment:
      SECRET_KEY_BASE: local-dev-secret-key-base-rotate-on-volume-reset
      FORCE_SSL: 'false'
      DATABASE_URL: postgresql://oci:oci@postgres:5432/oci_docuseal
    ports:
      - '3010:3000'
    depends_on:
      postgres:
        condition: service_healthy
      docuseal-bootstrap:
        condition: service_completed_successfully
    volumes:
      - oci-docuseal-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/up >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot DB bootstrap — DocuSeal expects an existing database;
  # create oci_docuseal alongside oci_dev. Idempotent.
  docuseal-bootstrap:
    image: postgres:17-alpine
    container_name: oci-docuseal-bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        PGPASSWORD=oci psql -h postgres -U oci -d oci_dev -tc \"SELECT 1 FROM pg_database WHERE datname = 'oci_docuseal'\" | grep -q 1 ||
        PGPASSWORD=oci psql -h postgres -U oci -d oci_dev -c 'CREATE DATABASE oci_docuseal OWNER oci;' &&
        echo 'docuseal database ready'
      "

volumes:
  oci-postgres-data:
  oci-minio-data:
  oci-docuseal-data:
