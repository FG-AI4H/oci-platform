# Local-only stack for `pnpm dev`. Mirrors the dev-env services that the
# CDK provisions in AWS (Aurora Postgres + ElastiCache-equivalent Redis)
# at small scale. NOT for prod use. Credentials match the URLs hardcoded
# in apps/api/.env.example and apps/web/.env.example.

services:
  postgres:
    image: postgres:17-alpine
    container_name: oci-postgres
    environment:
      POSTGRES_USER: oci
      POSTGRES_PASSWORD: oci
      POSTGRES_DB: oci_dev
    ports:
      - '5432:5432'
    volumes:
      - oci-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oci -d oci_dev']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    container_name: oci-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible store for local dataset uploads (PR I, #87).
  # Real envs use AWS S3 (CDK provisions oci-datasets-<env>); MinIO
  # gives us the same API surface for `pnpm dev` so the multipart
  # presigned-URL flow can be exercised end-to-end without an AWS
  # account. The browser PUTs directly to localhost:9000.
  minio:
    image: minio/minio:latest
    container_name: oci-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # MinIO console (browse uploaded objects)
    volumes:
      - oci-minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/ready']
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot bucket bootstrap. Creates oci-datasets-local on first
  # boot; idempotent thereafter. CORS is set to allow direct PUT from
  # the local web app at :3001 — the same configuration the prod
  # CDK applies to the real bucket.
  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb -p local/oci-datasets-local 2>/dev/null || true &&
        mc anonymous set none local/oci-datasets-local &&
        printf '{\"CORSRules\":[{\"AllowedOrigins\":[\"http://localhost:3001\"],\"AllowedMethods\":[\"PUT\",\"GET\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"]}]}' > /tmp/cors.json &&
        mc cors set /tmp/cors.json local/oci-datasets-local 2>/dev/null || true &&
        echo 'minio bucket ready'
      "

volumes:
  oci-postgres-data:
  oci-minio-data:
